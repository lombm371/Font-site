<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeelMEE</title>
  <style>
    @font-face {
      font-family: "PeelMEE";
      src: url("fonts/PEELMETYPE.otf") format("woff2"),
           url("fonts/PEELMETYPE.otf") format("opentype"),
           url("fonts/PEELMETYPE.otf") format("truetype");
      font-display: swap;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      color: #ffffff;
    }

    body {
    
  background-color: #000;
}             /* stays still behind the text */
    

    .type {
  box-sizing: border-box;
  display: flex;
  align-items: flex-start;          /* top of the page instead of the middle */
  justify-content: center;          /* keeps it centered left to right */
  padding: clamp(8px, 4vh, 48px) clamp(16px, 4vw, 48px) 0;   /* first number = distance from the top */
}

    #text {
      width: 100%;
      margin: 0;
      font-family: "PeelMEE", system-ui, sans-serif;
      font-weight: normal;
      font-size: clamp(56px, 15vw, 280px);
      line-height: 1.2;
      text-align: center;
      text-transform: none;
      overflow-wrap: break-word;
      outline: none;
      cursor: text;
    }

    /* iPhones ignore fixed backgrounds, so let it scroll there */
    @media (hover: none) {
      body { background-attachment: scroll; }
    }
  </style>
</head>
<body>
<a href="ref.html" style="display:inline-block; margin:0 clamp(12px,3vw,32px) 24px; line-height:0;">
  <img src="images/backbutton1.png" alt="Back" style="width:clamp(40px, 8vw, 120px); height:auto; display:block;">
</a>
  

  <main class="type">
    <h1 id="text" contenteditable="true" spellcheck="false">The Peeling vinyl Typeface!</h1>
  </main>

</body>
</html>
