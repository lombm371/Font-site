    /* Your custom font */
    @font-face {
      font-family: "PEELMETYPE";
      src: url("fonts/PEELMETYPE.otf") format("opentype");
    }

    body {
      margin: 0;
      padding: 24px 0;
      font-family: system-ui, sans-serif;
      background: #fff;
    }

    /* "References" heading, top centered */
    .page-title {
      font-family: "PEELMETYPE", system-ui, sans-serif;
      text-align: center;
      font-weight: normal;
      font-size: clamp(28px, 5vw, 64px);
      margin: 0 0 clamp(16px, 4vh, 48px);
    }

    /* 4 horizontal rows of images */
    .rows {
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 4vh, 48px);
    }
    .row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(12px, 3vw, 32px);
    }
    .tile {
      flex: 0 0 auto;
      display: block;
      line-height: 0;
      cursor: pointer;
    }
    .tile img {
      display: block;
      height: var(--img-height, clamp(36px, 7vw, 150px));
      width: auto;
    }

    /* The second cursor */
    #cursor2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: auto;
      pointer-events: none;
      z-index: 9999;
      display: none;
      transition: transform .12s ease-out;
    }
    @media (hover: none) { #cursor2 { display: none !important; } }

    /* Pop-up viewer */
    #viewer {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 16px;
      border: 0;
      background: rgba(255,255,255,.96);
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 24px);
    }
    #viewer[open] { display: flex; }
    #viewer img {
      display: block;
      max-width: calc(50% - 12px);
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
    }

    @media (max-width: 600px) {
      #viewer[open] { flex-direction: column; }
      #viewer img { max-width: 100%; max-height: calc(45vh - 12px); }
    }
  </style>
</head>

  <script>
    if (window.matchMedia("(min-width: 768px)").matches) {
      const cursor = document.getElementById('cursor2');

      // Mirror: row 1 <-> row 4, row 2 <-> row 3
      const target = { 1: 4, 2: 3, 3: 2, 4: 1 };

      function place(tile, e) {
        const row = tile.closest('.row').dataset.row;
        const targetRow = document.querySelector(`.row[data-row="${target[row]}"]`);
        if (!targetRow) { cursor.style.display = 'none'; return; }

        // Reversed order: 1st image -> last image, 2nd -> 2nd-to-last, ...
        const tiles = [...tile.parentElement.children];
        const targetTiles = [...targetRow.children];
        const index = Math.max(targetTiles.length - 1 - tiles.indexOf(tile), 0);
        const t = targetTiles[index].getBoundingClientRect();

        // Mirror where you are inside the image
        const r = tile.getBoundingClientRect();
        const fx = 1 - (e.clientX - r.left) / r.width;
        const fy = 1 - (e.clientY - r.top) / r.height;

        const x = t.left + window.scrollX + fx * t.width;
        const y = t.top + window.scrollY + fy * t.height;

        cursor.style.transform = `translate(${x}px, ${y}px)`;
        cursor.style.display = 'block';
      }

      document.querySelectorAll('.tile').forEach(tile => {
        tile.addEventListener('mousemove', e => place(tile, e));
        tile.addEventListener('mouseleave', () => { cursor.style.display = 'none'; });
      });
    }
  </script>

<script>
  const FILL = 0.85;      // how much of the row the images take up
  const MAX_HEIGHT = 260; // biggest the images are allowed to get, in px

  function fitRows() {
    let best = MAX_HEIGHT;
    document.querySelectorAll('.row').forEach(row => {
      const imgs = [...row.querySelectorAll('img')];
      const cs = getComputedStyle(row);
      const width = row.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);

      const total = imgs.reduce((sum, img) => sum + (img.naturalWidth / img.naturalHeight || 1), 0);

      best = Math.min(best, (width * FILL) / total);
    });
    document.documentElement.style.setProperty('--img-height', best + 'px');
  }

  window.addEventListener('load', fitRows);
  window.addEventListener('resize', fitRows);
</script>

<script>
  const viewer = document.getElementById('viewer');
  const viewerA = document.getElementById('viewer-a');
  const viewerB = document.getElementById('viewer-b');

  const pairRow = { 1: 4, 2: 3, 3: 2, 4: 1 };

  function partnerOf(tile) {
    const row = tile.closest('.row').dataset.row;
    const targetRow = document.querySelector(`.row[data-row="${pairRow[row]}"]`);
    if (!targetRow) return null;
    const tiles = [...tile.parentElement.children];
    const targetTiles = [...targetRow.children];
    const index = Math.max(targetTiles.length - 1 - tiles.indexOf(tile), 0);
    return targetTiles[index];
  }

  document.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', e => {
      e.preventDefault();
      const partner = partnerOf(tile);
      viewerA.src = tile.querySelector('img').src;
      if (partner) {
        viewerB.src = partner.querySelector('img').src;
        viewerB.style.display = 'block';
      } else {
        viewerB.style.display = 'none';
      }
      document.getElementById('cursor2').style.display = 'none';
      viewer.showModal();
    });
  });

  viewer.addEventListener('click', e => {
    if (e.target !== viewerA && e.target !== viewerB) viewer.close();
  });
</script>
